        <div class="log-panel">
            <div class="log-head">
                <span class="title">运行日志</span>
                <div class="log-seg" id="log-seg">
                    <button data-level="all" class="on">全部</button>
                    <button data-level="warn">警告</button>
                    <button data-level="error">错误</button>
                </div>
                <input class="log-search" id="log-search" placeholder="搜索…">
                <span class="spacer"></span>
                <button class="act" id="btn-log-copy">复制</button>
                <button class="act" id="btn-log-export">导出</button>
                <button class="act" id="btn-log-close">×</button>
            </div>
            <div class="log-body" id="log-body"></div>
            <div class="log-foot" id="log-foot">本次会话 0 条</div>
        </div>
    </div>

<script>
    // =====================================================================
    // 数据层：全部通过 Wails 绑定访问后端，后端返回 JSON 字符串
    //
    //   window.go.main.App.SelectKKSRoot()
    //   window.go.main.App.GetLeftTreeData(mode)
    //   window.go.main.App.GetRightTreeData(mode)
    //   window.go.main.App.ExecuteIsolate(paths, mode)
    //   window.go.main.App.ExecuteRestore(paths, mode)
    // =====================================================================

    // 每个 mode 对应的标题（后端同时会返回真实根路径）
    const modeLabels = {
        "female_card": "角色卡 (Female)",
        "male_card":   "角色卡 (Male)",
        "scene":       "场景卡 (Scene)",
        "pose":        "POSE 动作",
        "coord_f":     "女性服装 (Coordinate)",
        "coord_m":     "男性服装 (Coordinate)",
        "zipmod":      "Zipmod"
    };

    // 状态与 DOM
    let currentMode = 'female_card';
    let leftCurrentPath = '';
    let rightCurrentPath = '';
    let leftSelected = new Set();
    let rightSelected = new Set();
    let leftNodes = [];
    let rightNodes = [];
    let leftRoot = '';
    let rightRoot = '';
    let kksReady = false;

    // 焦点：当前预览的条目。点击行只切换焦点，不会改变勾选状态。
    let leftFocus = null;   // { id, name, type, path, mods, modNames }
    let rightFocus = null;

    // 操作模式：safe = 安全加载隔离模式，free = 自由修改模式
    let opMode = 'safe';

    const elLeftList = document.getElementById('left-list');
    const elRightList = document.getElementById('right-list');
    const elLeftPath = document.getElementById('left-path');
    const elRightPath = document.getElementById('right-path');
    const elSelectAllLeft = document.getElementById('select-all-left');
    const elSelectAllRight = document.getElementById('select-all-right');
    const elBtnBackLeft = document.getElementById('btn-back-left');
    const elBtnBackRight = document.getElementById('btn-back-right');
    const elRootLabel = document.getElementById('root-label');
    const elStatusBox = document.getElementById('status-box');
    const elStatusText = document.getElementById('status-text');
    const elProgressFill = document.getElementById('progress-fill');
    const elContextMenu = document.getElementById('context-menu');
    const elBtnMode = document.getElementById('btn-mode');
    const elBtnExecLeft = document.getElementById('btn-exec-left');
    const elBtnExecRight = document.getElementById('btn-exec-right');
    const elBtnRestoreHidden = document.getElementById('btn-restore-hidden');

    // ---------------------------------------------------------------------
    // 状态区域
    //   idle    : 未选择路径 —— 红底黑字，进度条隐藏
    //   loading : 正在加载   —— 红白闪烁(1s)，蓝色进度条推进
    //   error   : 加载错误   —— 红底黑字，进度条中止并变黄
    //   done    : 扫描完成   —— 黑底白字，进度条消失
    // ---------------------------------------------------------------------

    function setStatus(state, text, percent) {
        elStatusBox.classList.remove('state-loading', 'state-error', 'state-done');
        if (state === 'loading') {
            elStatusBox.classList.add('state-loading');
        } else if (state === 'error') {
            elStatusBox.classList.add('state-error');
        } else if (state === 'done') {
            elStatusBox.classList.add('state-done');
        }
        elStatusText.innerText = text;
        if (typeof percent === 'number' && isFinite(percent)) {
            const p = Math.max(0, Math.min(100, percent));
            elProgressFill.style.width = p + '%';
        } else {
            elProgressFill.style.width = '0%';
        }
    }

    // ---------------------------------------------------------------------
    // 操作模式切换
    // ---------------------------------------------------------------------

    function applyOpMode() {
        const isFree = opMode === 'free';
        // 按钮外观：自由模式红色，安全模式绿色
        elBtnMode.classList.toggle('mode-free', isFree);
        elBtnMode.classList.toggle('mode-safe', !isFree);
        elBtnMode.innerText = isFree ? '⚠ 自由修改模式' : '🛡 安全加载隔离模式';

        // 剪贴板工具条只在自由修改模式显示
        document.getElementById('clip-toolbar-left').classList.toggle('show', isFree);
        document.getElementById('clip-toolbar-right').classList.toggle('show', isFree);

        // 隐藏的文件夹模式下，隔离/启用按钮变灰禁用
        const isInvisible = currentMode === 'invisible';
        elBtnExecLeft.disabled = isInvisible;
        elBtnExecRight.disabled = isInvisible;
        elBtnRestoreHidden.style.display = isInvisible ? 'block' : 'none';

        // 自由模式按钮的显示/隐藏（§6）
        applyModeButtons();

        log(isFree
            ? '已切换到「自由修改模式」：可自由复制/剪切/粘贴，请自行确保依赖安全。'
            : '已切换到「安全加载隔离模式」：隔离与启用会严格校验 zipmod 依赖。');
    }

    elBtnMode.onclick = () => {
        opMode = (opMode === 'free') ? 'safe' : 'free';
        applyOpMode();
        renderAll();
    };

    // 模式或管理种类变化时，同步按钮可用状态
    function syncModeButtons() {
        const isInvisible = currentMode === 'invisible';
        elBtnExecLeft.disabled = isInvisible;
        elBtnExecRight.disabled = isInvisible;
        elBtnRestoreHidden.style.display = isInvisible ? 'block' : 'none';
    }

    // ---------------------------------------------------------------------
    // 工具
    // ---------------------------------------------------------------------

    // log 即时反馈。
    //
    // 右栏底部不再常驻日志框（§3.6），因此：
    //   - 重要消息走 toast（右下角轻提示）
    //   - 完整历史在后端环形缓冲，通过「查看日志」窗口查看
    function log(msg, type = 'info') {
        const level = type === 'success' ? 'success'
                    : type === 'warn' ? 'warn'
                    : type === 'err' ? 'error'
                    : 'info';
        // 追加到本地缓存（打开日志窗口时立即可见）
        logEntries.push({
            seq: ++logSeq,
            ts: Date.now(),
            level: level,
            scope: 'ui',
            msg: msg,
        });
        if (logModalOpen) renderLogs();

        // 成功与错误才弹 Toast，信息类不打扰用户
        if (level === 'success') toast(msg, 'success');
        else if (level === 'error') toast(msg, 'error');
        else if (level === 'warn') toast(msg, 'warn');
    }

    // 解析后端统一响应：{success, message, data}
    function unwrap(raw) {
        if (raw === undefined || raw === null) {
            return { success: false, message: '后端无响应。', data: null };
        }
        let obj;
        try {
            obj = typeof raw === 'string' ? JSON.parse(raw) : raw;
        } catch (e) {
            return { success: false, message: '返回数据解析失败: ' + raw, data: null };
        }
        if (!obj || typeof obj !== 'object') {
            return { success: false, message: String(raw), data: null };
        }
        return obj;
    }

    // 统一的异步调用封装
    async function callBackend(method, ...args) {
        try {
            const app = window.go && window.go.main && window.go.main.App;
            if (!app) {
                log('Wails 运行时未就绪，无法调用后端。', 'err');
                return { success: false, message: 'Wails 运行时未就绪。', data: null };
            }
            if (!app[method]) {
                log(`后端方法 ${method} 不存在。`, 'err');
                return { success: false, message: `后端方法 ${method} 不存在。`, data: null };
            }
            const raw = await app[method](...args);
            return unwrap(raw);
        } catch (e) {
            log('调用后端异常: ' + e, 'err');
            return { success: false, message: String(e), data: null };
        }
    }

    function formatSize(bytes) {
        if (!bytes) return '';
        const units = ['B', 'KB', 'MB', 'GB'];
        let v = bytes, i = 0;
        while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
        return v.toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
    }

    // ---------------------------------------------------------------------
    // 右栏面板（v2.1 §3）
    //
    // 数据来自一次 GetRightPanel 请求（红线 N6）。
    // 缩略图未就绪时渲染骨架格，由 thumb:ready 事件局部补图，
    // **不重渲染整个面板**。
    // ---------------------------------------------------------------------

    const elPanelSections = document.getElementById('panel-sections');
    const elPanelInfoTitle = document.getElementById('panel-info-title');
    const elPanelInfoSub = document.getElementById('panel-info-sub');

    // panelGen 当前面板代数，用于丢弃过期响应。
    let panelGen = 0;
    // panelThumbs thumbKey -> 已加载的 dataURI（避免重复设置 src）
    const panelThumbs = new Map();

    // panelSide 当前右栏跟随哪一侧（left / right）。
    let panelSide = 'left';

    // focusTimers 各侧的焦点延迟计时器。
    const focusTimers = { left: null, right: null };

    // resetPanel 清空右栏面板。
    function resetPanel() {
        panelGen++;
        elPanelSections.innerHTML = '';
        const empty = document.createElement('div');
        empty.className = 'panel-empty';
        empty.innerText = '暂无内容';
        elPanelSections.appendChild(empty);
        elPanelInfoTitle.innerText = '未选择文件';
        elPanelInfoSub.innerText = '';
        elPanelInfoSub.classList.remove('panel-info-warn');
    }

    // scheduleFocus 延迟设置焦点（等待双击序列结束）。
    //
    // 必须延迟：单击若立即重渲染，DOM 被 replaceChildren 重建，
    // 随后的 dblclick 事件就找不到原来的行（双击进不去文件夹）。
    function scheduleFocus(side, id) {
        if (focusTimers[side]) {
            clearTimeout(focusTimers[side]);
        }
        focusTimers[side] = setTimeout(() => {
            focusTimers[side] = null;
            setFocusByID(side, id);
        }, 220);
    }

    // setFocusByID 按 ID 设置焦点并刷新右栏面板。
    function setFocusByID(side, id) {
        const item = findNodeByID(side, id);
        if (!item) return;
        if (side === 'left') {
            leftFocus = item;
        } else {
            rightFocus = item;
        }
        // 右栏跟随焦点所在侧
        panelSide = side;
        renderList(side);
        refreshPanel();
    }

    // tileCount 返回实际渲染的格子数与 "还有" 数量。
    // 必须与后端 internal 的 tileCount 保持一致。
    //
    // n <= 9  : 全显示，无 "还有" 格
    // n >  9 : 显示 8 个 + 1 个 "还有 (n-8)" 格
    function tileCount(n) {
        if (n <= 9) return { tiles: n, more: 0 };
        return { tiles: 8, more: n - 8 };
    }

    // refreshPanel 重新拉取并渲染右栏。
    async function refreshPanel() {
        const side = panelSide;
        const focus = side === 'left' ? leftFocus : rightFocus;
        const curPath = side === 'left' ? leftCurrentPath : rightCurrentPath;
        const gen = ++panelGen;

        const res = await callBackend('GetRightPanel', side, currentMode, curPath, focus ? focus.id : '');
        if (gen !== panelGen) return;   // 已有更新的请求，丢弃本次响应
        if (!res.success) {
            renderPanel(null);
            return;
        }
        renderPanel(res.data || null);
    }

    // renderPanel 渲染面板数据。
    function renderPanel(panel) {
        elPanelSections.innerHTML = '';

        if (!panel) {
            const empty = document.createElement('div');
            empty.className = 'panel-empty';
            empty.innerText = '暂无内容';
            elPanelSections.appendChild(empty);
            elPanelInfoTitle.innerText = '未选择文件';
            elPanelInfoSub.innerText = '';
            return;
        }

        // --- 区域 ---
        (panel.sections || []).forEach(sec => {
            // Visible=false → 整块不渲染，不占位、不留空白（§3.5）
            if (!sec.visible) return;

            const section = document.createElement('div');
            section.className = 'panel-section';

            // 标题行：左标题 + 右计数
            const head = document.createElement('div');
            head.className = 'panel-section-head';
            const title = document.createElement('span');
            title.className = 'panel-section-title';
            title.innerText = sec.title;
            head.appendChild(title);

            const count = document.createElement('span');
            count.className = 'panel-section-count';
            count.innerText = sec.total + (sec.id === 'cards' ? ' 张' : (sec.id === 'plugins' ? ' 个' : ' 个'));
            head.appendChild(count);
            section.appendChild(head);

            // 格子
            const tiles = sec.tiles || [];
            if (sec.layout === 'list') {
                section.appendChild(renderPluginList(tiles));
            } else {
                const grid = document.createElement('div');
                grid.className = 'panel-grid';
                tiles.forEach(t => grid.appendChild(renderTile(t, sec)));
                section.appendChild(grid);
            }

            // 空态：非空且 Visible=true 时显示
            if (sec.total === 0 && sec.empty) {
                const empty = document.createElement('div');
                empty.className = 'panel-empty';
                empty.innerText = sec.empty;
                section.appendChild(empty);
            }

            elPanelSections.appendChild(section);
        });

        // 两区都不可见 → 统一空态
        const anyVisible = (panel.sections || []).some(s => s.visible);
        if (!anyVisible) {
            const empty = document.createElement('div');
            empty.className = 'panel-empty';
            empty.innerText = '此文件夹为空';
            elPanelSections.appendChild(empty);
        }

        // --- 信息栏 ---
        const focusInfo = panel.focus || {};
        elPanelInfoTitle.innerText = focusInfo.name || '未选择文件';
        const info = focusInfo.info || '';
        elPanelInfoSub.innerText = info;
        elPanelInfoSub.classList.toggle('panel-info-warn', info.includes('无法识别 GUID'));
        // 占用数可点击 → 打开占用详情
        const guid = currentZipmodGuid();
        elPanelInfoSub.style.cursor = guid ? 'pointer' : 'default';
        elPanelInfoSub.onclick = guid ? () => showZipmodRefDetail(guid) : null;
        elPanelInfoSub.title = guid ? '点击查看占用详情' : '';
    }

    // renderTile 渲染一个格子。
    function renderTile(tile, sec) {
        const cell = document.createElement('div');
        cell.className = 'panel-cell';
        if (tile.selected) cell.classList.add('is-selected');
        cell.dataset.abs = tile.abs || '';
        cell.dataset.thumbKey = tile.thumbKey || '';

        if (tile.kind === 'more') {
            // "还有 N 个" 格
            cell.classList.add('is-more');
            const more = document.createElement('div');
            more.className = 'more-label';
            more.innerText = tile.name;
            cell.appendChild(more);
            return cell;
        }

        // 缩略图
        const thumb = document.createElement('div');
        thumb.className = 'thumb';
        const cached = tile.thumbKey ? panelThumbs.get(tile.thumbKey) : null;
        if (tile.thumb) {
            panelThumbs.set(tile.thumbKey, tile.thumb);
            const img = document.createElement('img');
            img.src = tile.thumb;
            thumb.appendChild(img);
        } else if (cached) {
            const img = document.createElement('img');
            img.src = cached;
            thumb.appendChild(img);
        } else {
            // 骨架格：尺寸已定，先占位
            thumb.classList.add('is-pending');
            thumb.innerText = tile.kind === 'plugin' ? '🔌' : (tile.kind === 'folder' ? '📁' : '🖼️');
        }
        cell.appendChild(thumb);

        // 标题
        const cap = document.createElement('div');
        cap.className = 'caption';
        cap.innerText = tile.name || '';
        cap.title = tile.name || '';
        cell.appendChild(cap);

        // 副标签：文件夹格显示"N 个文件"，卡片格为空
        if (tile.badge) {
            const badge = document.createElement('div');
            badge.className = 'caption';
            badge.style.color = 'var(--text-3)';
            badge.innerText = tile.badge;
            cell.appendChild(badge);
        }

        // 点击 → 聚焦该条目
        cell.onclick = () => {
            if (!tile.abs) return;
            focusByAbs(tile.abs);
        };
        return cell;
    }

    // renderPluginList 渲染插件列表（1 列行式）。
    function renderPluginList(tiles) {
        const list = document.createElement('div');
        list.className = 'panel-list';
        tiles.forEach(t => {
            const row = document.createElement('div');
            row.className = 'panel-list-row';
            const ico = document.createElement('span');
            ico.className = 'ico';
            ico.innerText = t.kind === 'more' ? '⋯' : '🔌';
            row.appendChild(ico);

            const txt = document.createElement('div');
            txt.className = 'txt';
            const nm = document.createElement('div');
            nm.className = 'nm';
            nm.innerText = t.name || '';
            txt.appendChild(nm);
            if (t.badge) {
                const sub = document.createElement('div');
                sub.className = 'sub';
                sub.innerText = t.badge;
                txt.appendChild(sub);
            }
            row.appendChild(txt);

            if (t.kind !== 'more') {
                row.title = t.abs || '';
                row.onclick = () => showZipmodPluginDetail(t.abs);
            }
            list.appendChild(row);
        });
        return list;
    }

    // focusByAbs 按绝对路径聚焦某个条目（九宫格点击时用）。
    function focusByAbs(abs) {
        const side = panelSide;
        const nodes = side === 'left' ? leftNodes : rightNodes;
        const item = nodes.find(n => n.id === abs);
        if (!item) {
            // 不在当前列表内（例如 zipmod 引用了别处的卡片）→ 仍刷新预览
            renderFocusExternal(abs);
            return;
        }
        setFocusByID(side, abs);
    }

    // renderFocusExternal 焦点不在当前列表时（跨目录引用），仅更新信息栏。
    function renderFocusExternal(abs) {
        elPanelInfoTitle.innerText = abs.split(/[\\/]/).pop();
        elPanelInfoSub.innerText = abs;
    }

    // showZipmodPluginDetail 展示插件的命中详情。
    async function showZipmodPluginDetail(abs) {
        const res = await callBackend('GetZipmodDetail', currentZipmodGuid());
        if (!res.success) {
            showAlert(res.message || '无法获取详情。');
            return;
        }
        const d = res.data || {};
        const plugins = d.plugins || [];
        const target = plugins.find(p => p.abs === abs);
        if (!target) {
            showAlert('未找到该插件的详情。');
            return;
        }
        const html = `<div>${escapeHtml(target.abs)}</div>
            <div style="margin-top:8px;">命中方式：<b>${escapeHtml(target.hitMode || '未知')}</b></div>
            <div class="modal-list">${(target.guids || []).map(g => `<div>${escapeHtml(g)}</div>`).join('')}</div>`;
        openModal('插件命中详情', html, [{ label: '知道了', kind: 'primary' }]);
    }

    // currentZipmodGuid 返回当前焦点 zipmod 的 GUID。
    function currentZipmodGuid() {
        const focus = panelSide === 'left' ? leftFocus : rightFocus;
        if (!focus) return '';
        if (focus.guid) return focus.guid;
        // 兜底：从节点的 Mods 列表取（Mods[0] 就是 GUID）
        if (focus.mods && focus.mods.length) return focus.mods[0];
        return '';
    }

    // showZipmodRefDetail 展示 zipmod 的占用详情弹窗。
    //
    // 这是「为什么这个 mod 隔离不了」的关键信息：
    // 哪些卡片引用它、哪些 DLL 硬编码了它的 GUID。
    async function showZipmodRefDetail(guid) {
        if (!guid) {
            showAlert('无法识别该 zipmod 的 GUID。');
            return;
        }
        const res = await callBackend('GetZipmodDetail', guid);
        if (!res.success) {
            showAlert(res.message || '无法获取占用详情。');
            return;
        }
        const d = res.data || {};
        const cards = d.cards || [];
        const plugins = d.plugins || [];

        let html = `<div style="margin-bottom:10px;">
            <b>${escapeHtml(d.base || d.path || guid)}</b><br>
            <span style="color:var(--text-3);font-size:12px;">GUID: ${escapeHtml(guid)}</span><br>
            被 <b>${d.refCards || 0}</b> 个卡片 + <b>${d.refPlugins || 0}</b> 个插件引用
        </div>`;

        if (d.parseErr) {
            html += `<div style="color:var(--warning);margin-bottom:8px;">解析异常：${escapeHtml(d.parseErr)}</div>`;
        }

        if (cards.length) {
            html += `<div style="font-weight:600;margin:8px 0 4px;">引用它的卡片（${cards.length}）</div>`;
            html += '<div class="modal-list">';
            cards.slice(0, 50).forEach(c => {
                html += `<div>${escapeHtml(c)}</div>`;
            });
            html += '</div>';
        }

        if (plugins.length) {
            html += `<div style="font-weight:600;margin:10px 0 4px;">硬编码引用它的插件（${plugins.length}）</div>`;
            html += '<div class="modal-list">';
            plugins.forEach(p => {
                html += `<div>${escapeHtml(p.name)} <span style="color:var(--text-3)">[${escapeHtml(p.hitMode || '?')}]</span><br>` +
                        `<span style="color:var(--text-3);font-size:11px;">${escapeHtml(p.rel)}</span></div>`;
            });
            html += '</div>';
        }

        if (!cards.length && !plugins.length) {
            html += '<div style="color:var(--text-3);margin-top:8px;">没有任何引用 —— 可作为「多余 zipmod」隔离。</div>';
        }

        openModal('占用详情', html, [{ label: '知道了', kind: 'primary' }]);
    }

    function isInteractive(target) {
        return !!(target && target.closest && target.closest('input, button, a, .row-action'));
    }

    function findNodeByID(side, id) {
        const nodes = side === 'left' ? leftNodes : rightNodes;
        return nodes.find(n => n.id === id) || null;
    }

    function collectDescendants(nodes, item) {
        const ids = [item.id];
        // 该文件夹的**完整相对路径**（父目录 + 文件夹名）
        const prefix = item.path ? `${item.path}/${item.name}` : item.name;
        nodes.forEach(n => {
            // 子孙的 path 必然等于 prefix 或以 prefix + '/' 开头
            if (n.path === prefix || n.path.startsWith(prefix + '/')) {
                ids.push(n.id);
            }
        });
        return ids;
    }

    function setItemSelected(side, item, checked) {
        const isLeft = side === 'left';
        const nodes = isLeft ? leftNodes : rightNodes;
        const selectedSet = isLeft ? leftSelected : rightSelected;

        const targets = (item.type === 'folder')
            ? collectDescendants(nodes, item)
            : [item.id];

        targets.forEach(id => {
            if (checked) selectedSet.add(id);
            else selectedSet.delete(id);
        });
    }

    function isItemSelected(side, item) {
        const isLeft = side === 'left';
        const nodes = isLeft ? leftNodes : rightNodes;
        const selectedSet = isLeft ? leftSelected : rightSelected;

        if (item.type !== 'folder') {
            return selectedSet.has(item.id);
        }
        const targets = collectDescendants(nodes, item);
        return targets.every(id => selectedSet.has(id));
    }

    function syncSelectAll(side) {
        const isLeft = side === 'left';
        const nodes = isLeft ? leftNodes : rightNodes;
        const path = isLeft ? leftCurrentPath : rightCurrentPath;
        const selectedSet = isLeft ? leftSelected : rightSelected;
        const elSelectAll = isLeft ? elSelectAllLeft : elSelectAllRight;

        const rows = nodes.filter(n => n.path === path);
        const total = rows.length;
        const picked = rows.filter(n => isItemSelected(side, n)).length;

        elSelectAll.disabled = total === 0;
        elSelectAll.checked = total > 0 && picked === total;
        // 三态：部分选中
        elSelectAll.indeterminate = picked > 0 && picked < total;
    }

    function renderList(side) {
        const isLeft = side === 'left';
        const nodes = isLeft ? leftNodes : rightNodes;
        const path = isLeft ? leftCurrentPath : rightCurrentPath;
        const container = isLeft ? elLeftList : elRightList;
        const pathEl = isLeft ? elLeftPath : elRightPath;
        const backBtn = isLeft ? elBtnBackLeft : elBtnBackRight;
        const root = isLeft ? leftRoot : rightRoot;
        const focus = isLeft ? leftFocus : rightFocus;

        pathEl.innerText = path ? `${root}/${path}` : (root || '加载中...');
        backBtn.style.display = path ? 'block' : 'none';

        const items = nodes.filter(n => n.path === path);

        // 一次性生成 DOM 片段后整体替换，避免增量 patch 造成状态漂移
        const frag = document.createDocumentFragment();

        if (items.length === 0) {
            const empty = document.createElement('div');
            empty.style.cssText = 'padding:20px; text-align:center; color:#999;';
            empty.innerText = '此目录为空';
            frag.appendChild(empty);
        }

        items.forEach(item => {
            const div = document.createElement('div');
            // 行 DOM 只带 data-* 属性，不持有业务对象（避免闭包捕获过期引用）
            div.dataset.id = item.id;
            div.dataset.type = item.type;
            div.dataset.name = item.name;
            div.dataset.path = item.path || '';
            div.tabIndex = 0;
            div.className = `list-item ${item.type === 'folder' ? 'is-folder' : (item.type === 'mod' ? 'is-mod' : (item.type === 'hidden' ? 'is-hidden' : 'is-card'))}`;
            // 焦点行高亮（浅蓝底）
            if (focus && focus.id === item.id) {
                div.classList.add('is-focused');
            }

            // 复选框：所有类型都可勾选
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = 'row-check';
            cb.checked = isItemSelected(side, item);
            div.appendChild(cb);

            const nameSpan = document.createElement('span');
            nameSpan.className = 'name';
            // 隐藏的文件夹与普通文件夹使用完全相同的图标（§3.5）
            const icon = item.type === 'folder' || item.type === 'hidden' ? '📁'
                       : item.type === 'mod' ? '📦'
                       : '🖼️';
            nameSpan.innerText = `${icon} ${item.name}`;
            div.appendChild(nameSpan);

            if (item.type === 'folder') {
                // 文件夹右侧的隐藏按钮（眼睛带斜杠）
                //
                // §9.6：只有**递归文件数为 0** 的空文件夹才渲染隐藏按钮。
                // 数据来自后端 FolderStats.totalFiles，不额外扫盘。
                const stats = item.folderStats;
                const isEmpty = !stats || stats.totalFiles === 0;
                if (isEmpty) {
                    const hideBtn = document.createElement('button');
                    hideBtn.className = 'btn-hide-folder row-action';
                    hideBtn.dataset.action = 'hide';
                    hideBtn.title = '隐藏该空文件夹';
                    hideBtn.innerHTML = '🚫👁';
                    div.appendChild(hideBtn);
                }
            } else if (item.type === 'mod') {
                // zipmod：第三列显示红色占用数（不是文件大小）
                const span = document.createElement('span');
                span.className = 'ref-count' + (item.refCount === 0 ? ' is-zero' : '');
                span.textContent = String(item.refCount || 0);
                span.title = `被 ${item.refCount || 0} 个文件占用：卡片 ${item.refCards || 0}，插件 ${item.refPlugins || 0}`;
                div.appendChild(span);
            } else if (item.type === 'hidden') {
                // 隐藏项用灰色小标签区分，不靠图标
                const tag = document.createElement('span');
                tag.className = 'hidden-tag';
                tag.innerText = '已隐藏';
                div.appendChild(tag);
            } else if (item.size) {
                const sizeSpan = document.createElement('span');
                sizeSpan.className = 'size';
                sizeSpan.innerText = formatSize(item.size);
                div.appendChild(sizeSpan);
            }

            frag.appendChild(div);
        });

        container.replaceChildren(frag);
        syncSelectAll(side);
    }

    function renderAll() {
        renderList('left');
        renderList('right');
    }

    async function loadLeft() {
        let res;
        if (currentMode === 'zipmod') {
            // zipmod 模式：左侧展示 mods 目录中已安装的 zipmod
            res = await callBackend('GetInstalledModsData');
        } else if (currentMode === 'invisible') {
            res = await callBackend('GetInvisibleTreeData');
            if (res.success) {
                const d = res.data || {};
                leftNodes = (d.left && d.left.nodes) || [];
                leftRoot = (d.left && d.left.root) || '';
                renderList('left');
                return;
            }
        } else if (currentMode === 'trash') {
            // 回收站：只读浏览
            res = await callBackend('GetTrashTree');
            if (res.success) {
                const list = res.data || [];
                leftNodes = list.map(e => ({
                    id: e.abs,
                    name: e.name || e.rel,
                    type: 'card',
                    path: '',
                    mods: [],
                    modNames: [],
                    size: e.size || 0,
                    rel: e.rel,
                    trashRel: e.rel,
                    originalAbs: e.originalAbs,
                }));
                leftRoot = '回收站';
                renderList('left');
                return;
            }
        } else {
            res = await callBackend('GetLeftTreeData', currentMode);
        }
        if (!res.success) {
            log(res.message || '加载左侧列表失败。', 'err');
            leftNodes = []; leftRoot = '';
            renderList('left');
            return;
        }
        const data = res.data || {};
        leftNodes = data.nodes || [];
        leftRoot = data.root || '';
        renderList('left');
    }

    async function loadRight() {
        let res;
        if (currentMode === 'zipmod') {
            res = await callBackend('GetModsTreeData');
        } else if (currentMode === 'invisible') {
            res = await callBackend('GetInvisibleTreeData');
            if (res.success) {
                const d = res.data || {};
                rightNodes = (d.right && d.right.nodes) || [];
                rightRoot = (d.right && d.right.root) || '';
                renderList('right');
                return;
            }
        } else {
            res = await callBackend('GetRightTreeData', currentMode);
        }
        if (!res.success) {
            log(res.message || '加载右侧列表失败。', 'err');
            rightNodes = []; rightRoot = '';
            renderList('right');
            return;
        }
        const data = res.data || {};
        rightNodes = data.nodes || [];
        rightRoot = data.root || '';
        renderList('right');
    }

    async function refreshAll() {
        await Promise.all([loadLeft(), loadRight()]);
        // 右栏跟随焦点侧刷新
        refreshPanel();
    }

    // ---------------------------------------------------------------------
    // 自由模式 CRUD（§6）
    // ---------------------------------------------------------------------

    // applyModeButtons 按当前模式显示/隐藏操作按钮。
    //
    // §6：自由模式下这些按钮**不渲染**（不是禁用）；
    //      安全模式下完全没有新建/重命名/删除入口。
    function applyModeButtons() {
        const isFree = opMode === 'free';
        const isTrash = currentMode === 'trash';
        const isInvisible = currentMode === 'invisible';

        const freeOnly = ['btn-new-folder', 'btn-rename', 'btn-delete'];
        freeOnly.forEach(id => {
            const el = document.getElementById(id);
            // 自由模式 + 非回收站/隐藏模式时才显示
            el.style.display = (isFree && !isTrash && !isInvisible) ? 'block' : 'none';
        });

        document.getElementById('btn-trash-restore').style.display = isTrash ? 'block' : 'none';
        document.getElementById('btn-trash-purge').style.display = isTrash ? 'block' : 'none';

        // zipmod 管理按钮：仅 zipmod 模式
        const isZipmod = currentMode === 'zipmod';
        document.getElementById('btn-fix-missing').style.display = isZipmod ? 'block' : 'none';
        document.getElementById('btn-isolate-extra').style.display = isZipmod ? 'block' : 'none';

        // 隔离/启用在回收站与隐藏模式下禁用
        elBtnExecLeft.disabled = isTrash || isInvisible;
        elBtnExecRight.disabled = isTrash || isInvisible;
        elBtnRestoreHidden.style.display = isInvisible ? 'block' : 'none';
    }

    // doNewFolder 新建文件夹（创建 + 立即 inline 重命名，§6.1）。
    async function doNewFolder(side) {
        if (opMode !== 'free') {
            showAlert('自由修改模式下才能新建文件夹。');
            return;
        }
        const curPath = side === 'left' ? leftCurrentPath : rightCurrentPath;
        const res = await callBackend('CmdMkdir', side, currentMode, curPath);
        if (!res.success) {
            showAlert(res.message || '新建失败。');
            return;
        }
        const d = res.data || {};
        await refreshAll();
        toast('已创建「' + (d.name || '') + '」，可直接重命名', 'success');
        // 进入 inline 重命名
        startInlineRename(side, d.path, d.name);
    }

    // startInlineRename 进入 inline 重命名状态。
    function startInlineRename(side, path, currentName) {
        const nodes = side === 'left' ? leftNodes : rightNodes;
        const item = nodes.find(n => n.id === path);
        if (!item) return;

        // 找到对应的行
        const list = side === 'left' ? elLeftList : elRightList;
        const rows = Array.from(list.querySelectorAll('.list-item'));
        const row = rows.find(r => r.dataset.id === path);
        if (!row) return;

        const nameSpan = row.querySelector('.name');
        if (!nameSpan) return;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'inline-rename';
        input.value = currentName || '';
        nameSpan.replaceWith(input);
        input.focus();
        // 全选文件名（不含扩展名）
        const dot = input.value.lastIndexOf('.');
        input.setSelectionRange(0, dot > 0 ? dot : input.value.length);

        let done = false;
        const finish = async (commit) => {
            if (done) return;
            done = true;
            const newName = input.value.trim();
            if (!commit || !newName || newName === currentName) {
                // Esc / 未改名 → 保留原名
                await refreshAll();
                return;
            }
            const r = await callBackend('CmdRename', path, newName);
            if (!r.success) {
                showAlert(r.message || '重命名失败。');
                await refreshAll();
                return;
            }
            toast('已重命名为「' + newName + '」', 'success');
            await refreshAll();
        };

        input.onkeydown = (e) => {
            e.stopPropagation();
            if (e.key === 'Enter') {
                e.preventDefault();
                finish(true);
            } else if (e.key === 'Escape') {
                e.preventDefault();
                finish(false);
            }
        };
        input.onblur = () => finish(true);
    }

    // doRename 重命名焦点条目（F2 / 右键）。
    async function doRename(side) {
        if (opMode !== 'free') {
            showAlert('自由修改模式下才能重命名。');
            return;
        }
        const focus = side === 'left' ? leftFocus : rightFocus;
        if (!focus) {
            showAlert('请先选中一个条目。');
            return;
        }
        startInlineRename(side, focus.id, focus.name);
    }

    // doDelete 删除选中条目（进回收站，§6.4）。
    async function doDelete(side) {
        if (opMode !== 'free') {
            showAlert('安全加载隔离模式下没有删除入口。');
            return;
        }
        const selected = side === 'left' ? leftSelected : rightSelected;
        if (selected.size === 0) {
            showAlert('请先勾选要删除的条目。');
            return;
        }

        // 两阶段：先出计划
        const planRes = await callBackend('PlanDelete', Array.from(selected));
        if (!planRes.success) {
            showAlert(planRes.message || '无法生成删除计划。');
            return;
        }
        const plan = planRes.data || {};
        if (plan.conflicts && plan.conflicts.length) {
            showConflict('删除冲突', plan.conflicts, () => {});
            return;
        }
        const items = plan.items || [];
        if (!items.length) {
            showAlert('没有可删除的条目。');
            return;
        }

        // 二次确认
        showConfirm('移入回收站',
            `将把 ${items.length} 个项目移入回收站（共 ${formatBytes(plan.totalBytes || 0)}），可在「回收站（DELED）」中还原。`,
            async () => {
                const res = await callBackend('CommitDelete', Array.from(selected));
                if (!res.success) {
                    showAlert(res.message || '删除失败。');
                    return;
                }
                toast('已移入回收站', 'success');
                if (side === 'left') leftSelected.clear(); else rightSelected.clear();
                await refreshAll();
            }, '移入回收站');
    }

    // doTrashRestore 还原回收站条目。
    async function doTrashRestore() {
        const selected = leftSelected;
        if (selected.size === 0) {
            showAlert('请先勾选要还原的条目。');
            return;
        }
        const rels = Array.from(selected);
        const res = await callBackend('CmdTrashRestore', rels);
        if (!res.success) {
            showAlert(res.message || '还原失败。');
            return;
        }
        const d = res.data || {};
        if (d.conflicts && d.conflicts.length) {
            showConflict('还原冲突', d.conflicts, () => {});
        }
        toast('已还原 ' + (d.restored || 0) + ' 个项目', 'success');
        leftSelected.clear();
        await refreshAll();
    }

    // doTrashPurge 彻底删除回收站条目（需输入名称确认）。
    async function doTrashPurge() {
        const selected = leftSelected;
        if (selected.size === 0) {
            showAlert('请先勾选要彻底删除的条目。');
            return;
        }
        const rels = Array.from(selected);
        const first = leftNodes.find(n => leftSelected.has(n.id));
        const name = first ? first.name : '';

        // 二次确认 + 输入名称
        openModal('彻底删除',
            `<div style="color:#c62828;margin-bottom:8px;">此操作将<b>永久删除</b>所选条目，无法撤销。</div>` +
            `<div>请输入 <b>${escapeHtml(name)}</b> 以确认：</div>` +
            `<input id="purge-confirm" style="width:100%;margin-top:8px;padding:6px 8px;border:1px solid var(--border);border-radius:4px;" placeholder="${escapeHtml(name)}">`,
            [
                { label: '取消' },
                { label: '永久删除', kind: 'danger', onClick: async () => {
                    const input = document.getElementById('purge-confirm');
                    const text = input ? input.value.trim() : '';
                    const res = await callBackend('CmdTrashPurge', rels, text);
                    if (!res.success) {
                        showAlert(res.message || '彻底删除失败。');
                        return;
                    }
                    toast('已彻底删除', 'success');
                    leftSelected.clear();
                    await refreshAll();
                }},
            ]);
    }

    // 绑定自由模式按钮
    document.getElementById('btn-new-folder').onclick = () => doNewFolder('left');
    document.getElementById('btn-rename').onclick = () => doRename('left');
    document.getElementById('btn-delete').onclick = () => doDelete('left');
    document.getElementById('btn-trash-restore').onclick = doTrashRestore;
    document.getElementById('btn-trash-purge').onclick = doTrashPurge;

    // ---------------------------------------------------------------------
    // 空白区域菜单（§6.3）
    // ---------------------------------------------------------------------

    // blankLeftMenu 设置项：左键单击空白是否也打开菜单（默认关）。
    let blankLeftMenu = false;

    // showBlankMenu 空白区右键 → 目录菜单。
    function showBlankMenu(x, y, side) {
        elContextMenu.innerHTML = '';
        const isFree = opMode === 'free';
        const isTrash = currentMode === 'trash';
        const isInvisible = currentMode === 'invisible';

        const addItem = (label, handler, disabled, shortcut) => {
            const mi = document.createElement('div');
            mi.className = 'menu-item' + (disabled ? ' disabled' : '');
            mi.innerHTML = shortcut
                ? `${escapeHtml(label)}<span style="float:right;color:#999;font-size:11px;">${escapeHtml(shortcut)}</span>`
                : escapeHtml(label);
            if (!disabled) {
                mi.onclick = () => { hideContextMenu(); handler(); };
            }
            elContextMenu.appendChild(mi);
        };
        const addSep = () => {
            const sep = document.createElement('div');
            sep.className = 'menu-sep';
            elContextMenu.appendChild(sep);
        };

        const hasClipboard = clipboardHasContent();

        if (isFree && !isTrash && !isInvisible) {
            addItem('粘贴', () => doPaste(side), !hasClipboard, 'Ctrl+V');
            addSep();
            addItem('新建文件夹', () => doNewFolder(side), false, 'Ctrl+Shift+N');
            addSep();
        }
        addItem('全选', () => selectAllInView(side), false, 'Ctrl+A');
        addItem('刷新', () => refreshAll(), false, 'F5');
        addSep();
        addItem('在资源管理器中打开', () => openInExplorer(side), false);

        elContextMenu.classList.add('show');
        const rect = elContextMenu.getBoundingClientRect();
        const px = Math.min(x, window.innerWidth - rect.width - 8);
        const py = Math.min(y, window.innerHeight - rect.height - 8);
        elContextMenu.style.left = px + 'px';
        elContextMenu.style.top = py + 'px';
    }

    // selectAllInView 全选当前视图。
    function selectAllInView(side) {
        const isLeft = side === 'left';
        const nodes = isLeft ? leftNodes : rightNodes;
        const path = isLeft ? leftCurrentPath : rightCurrentPath;
        const set = isLeft ? leftSelected : rightSelected;
        nodes.filter(n => n.path === path).forEach(n => set.add(n.id));
        renderList(side);
    }

    // openInExplorer 在资源管理器中打开当前目录。
    async function openInExplorer(side) {
        const res = await callBackend('OpenDelCardsRoot');
        if (!res.success) {
            showAlert(res.message || '无法打开目录。');
        }
    }

    // ---------------------------------------------------------------------
    // 历史窗口（§8.4）
    // ---------------------------------------------------------------------

    const elHistoryModal = document.getElementById('history-modal');
    const elHistoryBody = document.getElementById('history-body');
    const elHistoryFoot = document.getElementById('history-foot');

    let historyEntries = [];
    let historyFilter = 'all';

    // openHistory 打开历史窗口。
    async function openHistory() {
        elHistoryModal.classList.add('show');
        await reloadHistory();
    }

    // closeHistory 关闭历史窗口。
    function closeHistory() {
        elHistoryModal.classList.remove('show');
    }

    // reloadHistory 拉取历史并渲染。
    async function reloadHistory() {
        const res = await callBackend('GetHistory', 0, 200);
        if (!res.success) {
            historyEntries = [];
        } else {
            const d = res.data || {};
            historyEntries = d.entries || [];
        }
        renderHistory();
    }

    // renderHistory 渲染历史列表。
    function renderHistory() {
        const rows = historyEntries.filter(e => {
            if (historyFilter === 'undoable') {
                return e.status === 'committed' && !e.reverted && (e.steps || []).length > 0;
            }
            if (historyFilter === 'reverted') {
                return e.reverted || e.status === 'reverted';
            }
            return true;
        });

        elHistoryBody.innerHTML = '';
        if (rows.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'panel-empty';
            empty.innerText = '暂无操作记录';
            elHistoryBody.appendChild(empty);
        }

        rows.forEach(e => {
            const row = document.createElement('div');
            row.className = 'history-row';

            const t = document.createElement('span');
            t.className = 't';
            t.innerText = formatLogTime(e.at);
            row.appendChild(t);

            const n = document.createElement('span');
            n.className = 'n';
            n.innerText = e.title || e.kind || '';
            n.title = e.title || '';
            row.appendChild(n);

            const c = document.createElement('span');
            c.className = 'c';
            c.innerText = `影响 ${e.affected || 0} 项`;
            row.appendChild(c);

            const st = document.createElement('span');
            st.className = 'st s-' + (e.status || 'committed');
            st.innerText = historyStatusText(e);
            row.appendChild(st);

            const btn = document.createElement('button');
            btn.className = 'btn-undo';
            btn.innerText = '撤销';
            const undoable = e.status === 'committed' && !e.reverted && (e.steps || []).length > 0;
            btn.disabled = !undoable;
            if (!undoable) {
                btn.title = e.reverted ? '已撤销' : ((e.steps || []).length === 0 ? '超出可撤销范围' : '不可撤销');
            }
            btn.onclick = () => doUndo(e.txId);
            row.appendChild(btn);

            elHistoryBody.appendChild(row);
        });

        elHistoryFoot.innerText = `保留最近 ${historyEntries.length} 条记录`;
    }

    // historyStatusText 把状态码转成中文。
    function historyStatusText(e) {
        if (e.reverted || e.status === 'reverted') return '已撤销';
        switch (e.status) {
            case 'committed': return '已完成';
            case 'rolledback': return '已回滚';
            case 'partial': return '失败';
            default: return e.status || '';
        }
    }

    // doUndo 撤销一个操作。
    async function doUndo(txId) {
        showConfirm('撤销操作', '确定要撤销这次操作吗？文件会回到操作前的位置。', async () => {
            const res = await callBackend('CmdUndo', txId);
            if (!res.success) {
                showAlert(res.message || '撤销失败。');
                return;
            }
            toast('已撤销', 'success');
            await reloadHistory();
            await refreshAll();
        }, '撤销');
    }

    document.getElementById('btn-open-history').onclick = openHistory;
    document.getElementById('btn-history-close').onclick = closeHistory;
    elHistoryModal.addEventListener('click', (e) => {
        if (e.target === elHistoryModal) closeHistory();
    });
    document.getElementById('history-seg').addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        historyFilter = btn.dataset.filter;
        Array.from(document.getElementById('history-seg').children).forEach(b => b.classList.toggle('on', b === btn));
        renderHistory();
    });

    // ---------------------------------------------------------------------
    // 日志窗口（§3.6）
    // ---------------------------------------------------------------------

    const elLogModal = document.getElementById('log-modal');
    const elLogBody = document.getElementById('log-body');
    const elLogFoot = document.getElementById('log-foot');
    const elLogSearch = document.getElementById('log-search');

    // logEntries 缓存的日志条目。
    let logEntries = [];
    let logSeq = 0;
    let logLevel = 'all';
    let logFollow = true;
    // logModalOpen 日志窗口是否打开（决定是否即时重渲染）
    let logModalOpen = false;

    // openLogModal 打开日志窗口。
    async function openLogModal() {
        elLogModal.classList.add('show');
        logModalOpen = true;
        await reloadLogs();
        scrollLogToBottom();
    }

    // closeLogModal 关闭日志窗口。
    function closeLogModal() {
        elLogModal.classList.remove('show');
        logModalOpen = false;
    }

    // reloadLogs 从后端增量拉取日志。
    async function reloadLogs() {
        const res = await callBackend('GetLogs', logSeq, logLevel);
        if (!res.success) return;
        const d = res.data || {};
        const entries = d.entries || [];
        if (entries.length) {
            logEntries = logEntries.concat(entries);
            logSeq = d.seq || logSeq;
        }
        renderLogs();
    }

    // renderLogs 渲染日志列表（前端只负责渲染，不自己拼字符串）。
    function renderLogs() {
        const q = (elLogSearch.value || '').trim().toLowerCase();
        const rows = logEntries.filter(e => {
            if (logLevel !== 'all' && e.level !== logLevel) return false;
            if (q && !String(e.msg || '').toLowerCase().includes(q)) return false;
            return true;
        });

        elLogBody.innerHTML = '';
        rows.forEach(e => {
            const row = document.createElement('div');
            row.className = 'log-row lv-' + (e.level || 'info');
            const ts = document.createElement('span');
            ts.className = 'ts';
            ts.innerText = formatLogTime(e.ts);
            const lv = document.createElement('span');
            lv.className = 'lv';
            lv.innerText = levelText(e.level);
            const ms = document.createElement('span');
            ms.className = 'ms';
            ms.innerText = e.msg || '';
            row.appendChild(ts); row.appendChild(lv); row.appendChild(ms);
            elLogBody.appendChild(row);
        });

        const errors = logEntries.filter(e => e.level === 'error').length;
        elLogFoot.innerText = `本次会话 ${logEntries.length} 条 · 错误 ${errors} 条`;
    }

    // formatLogTime 把毫秒时间戳格式化为 HH:MM:SS。
    function formatLogTime(ts) {
        if (!ts) return '';
        const d = new Date(ts);
        const p = n => String(n).padStart(2, '0');
        return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }

    // levelText 把级别码转成中文。
    function levelText(level) {
        return { info: '信息', success: '成功', warn: '警告', error: '错误' }[level] || level || '';
    }

    // scrollLogToBottom 滚动到底部（跟随最新）。
    function scrollLogToBottom() {
        if (!logFollow) return;
        elLogBody.scrollTop = elLogBody.scrollHeight;
    }

    // 监听滚动：滚到非底部则暂停跟随。
    elLogBody.addEventListener('scroll', () => {
        const nearBottom = elLogBody.scrollHeight - elLogBody.scrollTop - elLogBody.clientHeight < 24;
        logFollow = nearBottom;
    });

    // 日志窗口交互
    document.getElementById('btn-open-log').onclick = openLogModal;
    document.getElementById('btn-log-close').onclick = closeLogModal;
    elLogModal.addEventListener('click', (e) => {
        if (e.target === elLogModal) closeLogModal();
    });
    document.getElementById('log-seg').addEventListener('click', async (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        logLevel = btn.dataset.level;
        Array.from(document.getElementById('log-seg').children).forEach(b => b.classList.toggle('on', b === btn));
        await reloadLogs();
    });
    elLogSearch.addEventListener('input', renderLogs);
    document.getElementById('btn-log-copy').onclick = async () => {
        const text = logEntries.map(e => `${formatLogTime(e.ts)} [${levelText(e.level)}] ${e.msg}`).join('\n');
        try {
            await navigator.clipboard.writeText(text);
            toast('日志已复制到剪贴板', 'success');
        } catch (e) {
            showAlert('复制失败：' + e);
        }
    };
    document.getElementById('btn-log-export').onclick = () => {
        const text = logEntries.map(e => `${formatLogTime(e.ts)} [${levelText(e.level)}] ${e.msg}`).join('\n');
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'kks-log-' + Date.now() + '.txt';
        a.click();
        URL.revokeObjectURL(a.href);
        toast('日志已导出', 'success');
    };

    // ---------------------------------------------------------------------
    // 对话框体系（§11.6）
    //
    // 硬要求：后端返回 success:false 且属于「用户操作失败」时，
    // 必须弹 Alert 或 Conflict，不允许只 log()。
    // 这是用户抱怨「粘贴出错不会弹窗提示」的直接修复。
    // ---------------------------------------------------------------------

    const elModalMask = document.getElementById('modal-mask');
    const elModalTitle = document.getElementById('modal-title');
    const elModalBody = document.getElementById('modal-body');
    const elModalFoot = document.getElementById('modal-foot');
    const elToastStack = document.getElementById('toast-stack');

    // closeModal 关闭模态框。
    function closeModal() {
        elModalMask.classList.remove('show');
        elModalBody.innerHTML = '';
        elModalFoot.innerHTML = '';
    }

    // openModal 打开模态框。
    //
    // buttons: [{ label, kind, onClick }]，onClick 返回 false 时不关闭。
    function openModal(title, bodyHtml, buttons) {
        elModalTitle.innerText = title;
        elModalBody.innerHTML = bodyHtml;
        elModalFoot.innerHTML = '';
        (buttons || [{ label: '知道了' }]).forEach(b => {
            const btn = document.createElement('button');
            btn.innerText = b.label;
            if (b.kind) btn.className = 'btn-' + b.kind;
            btn.onclick = () => {
                if (b.onClick) {
                    const keep = b.onClick();
                    if (keep === false) return;
                }
                closeModal();
            };
            elModalFoot.appendChild(btn);
        });
        elModalMask.classList.add('show');
    }

    // showAlert 阻断性错误提示 —— 用户必须看到。
    function showAlert(message, title) {
        log(message, 'err');
        openModal(title || '操作失败', `<div>${escapeHtml(message)}</div>`, [{ label: '知道了', kind: 'primary' }]);
    }

    // showConfirm 二次确认。
    function showConfirm(title, message, onConfirm, confirmLabel) {
        openModal(title, `<div>${escapeHtml(message)}</div>`, [
            { label: '取消' },
            { label: confirmLabel || '确定', kind: 'danger', onClick: onConfirm },
        ]);
    }

    // showConflict 冲突清单（§6.4）。
    //
    // conflicts: [{ src, dst, reason }]，onResolve 接收处置方式。
    function showConflict(title, conflicts, onResolve) {
        const shown = conflicts.slice(0, 10);
        let html = `<div>共发现 <b>${conflicts.length}</b> 项冲突，操作未执行。</div>`;
        html += '<div class="modal-list">';
        shown.forEach(c => {
            html += `<div>${escapeHtml(c.dst || '')}<br>${escapeHtml(c.reason || '目标已存在')}</div>`;
        });
        html += '</div>';
        if (conflicts.length > shown.length) {
            html += `<div style="margin-top:6px;color:#8b95a1;">还有 ${conflicts.length - shown.length} 项未显示</div>`;
        }
        openModal(title, html, [
            { label: '取消' },
            { label: '跳过冲突项', onClick: () => onResolve('skip') },
            { label: '全部取消', kind: 'danger', onClick: () => onResolve('abort') },
        ]);
    }

    // toast 轻提示，右下角堆叠，最多 3 条，2.5s 自动消失。
    function toast(message, kind) {
        const t = document.createElement('div');
        t.className = 'toast' + (kind ? ' toast-' + kind : '');
        t.innerText = message;
        elToastStack.appendChild(t);
        while (elToastStack.children.length > 3) {
            elToastStack.removeChild(elToastStack.firstChild);
        }
        setTimeout(() => {
            if (t.parentNode) t.parentNode.removeChild(t);
        }, 2500);
    }

    // escapeHtml 转义 HTML，避免把路径里的尖括号当标签解析。
    function escapeHtml(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // 点击遮罩关闭；Esc 关闭
    elModalMask.addEventListener('click', (e) => {
        if (e.target === elModalMask) closeModal();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        // 日志窗口优先关闭（它是独立模态）
        if (elLogModal && elLogModal.classList.contains('show')) {
            closeLogModal();
            return;
        }
        if (elHistoryModal && elHistoryModal.classList.contains('show')) {
            closeHistory();
            return;
        }
        if (elModalMask.classList.contains('show')) {
            closeModal();
        }
    });

    // ---------------------------------------------------------------------
    // 列表事件委托
    //
    // 每个列表容器只绑定这几个监听器，不给每一行绑事件。
    // 行 DOM 只带 data-id，交互时按 id 回查状态对象，
    // 避免闭包捕获已过期的对象。
    // ---------------------------------------------------------------------

    function bindListEvents(side) {
        const list = side === 'left' ? elLeftList : elRightList;

        // 单击：切换焦点（不改勾选）
        list.addEventListener('click', (e) => {
            const row = e.target.closest('.list-item');
            if (!row) return;

            // 隐藏按钮：独立处理
            const actionBtn = e.target.closest('[data-action="hide"]');
            if (actionBtn) {
                e.stopPropagation();
                const item = findNodeByID(side, row.dataset.id);
                if (item) hideFolder(item, side);
                return;
            }

            // 复选框：改勾选（不改焦点）
            if (e.target.closest('input[type="checkbox"]')) {
                const item = findNodeByID(side, row.dataset.id);
                if (item) {
                    setItemSelected(side, item, e.target.checked);
                    renderList(side);
                }
                return;
            }

            // 其它交互控件不触发焦点切换
            if (isInteractive(e.target)) return;

            // 延迟到下一帧再重渲染。
            // 否则单击会立即 replaceChildren 重建 DOM，
            // 导致随后的 dblclick 事件找不到原来的行（双击进不去文件夹）。
            const id = row.dataset.id;
            scheduleFocus(side, id);
        });

        // 双击：文件夹进入
        list.addEventListener('dblclick', (e) => {
            const row = e.target.closest('.list-item');
            if (!row) return;
            if (isInteractive(e.target)) return;
            if (row.dataset.type !== 'folder') return;
            // 双击已确认，取消待执行的单击焦点切换
            if (focusTimers[side]) {
                clearTimeout(focusTimers[side]);
                focusTimers[side] = null;
            }
            const curPath = side === 'left' ? leftCurrentPath : rightCurrentPath;
            const newPath = curPath ? `${curPath}/${row.dataset.name}` : row.dataset.name;
            if (side === 'left') leftCurrentPath = newPath;
            else rightCurrentPath = newPath;
            renderList(side);
        });

        // 右键：打开菜单
        list.addEventListener('contextmenu', (e) => {
            const row = e.target.closest('.list-item');
            if (!row) {
                hideContextMenu();
                return;
            }
            e.preventDefault();
            e.stopPropagation();
            const item = findNodeByID(side, row.dataset.id);
            if (!item) return;
            setFocusByID(side, row.dataset.id);
            showContextMenu(e.clientX, e.clientY, side, item);
        });

        // 键盘：空格切换勾选
        list.addEventListener('keydown', (e) => {
            const row = e.target.closest('.list-item');
            if (!row) return;
            if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                const item = findNodeByID(side, row.dataset.id);
                if (!item) return;
                const next = !isItemSelected(side, item);
                setItemSelected(side, item, next);
                renderList(side);
            }
        });

        // 空白处右键 → 目录菜单（§6.3 主行为）
        list.addEventListener('contextmenu', (e) => {
            if (e.target.closest('.list-item')) return;   // 行内的右键已由上面处理
            e.preventDefault();
            hideContextMenu();
            showBlankMenu(e.clientX, e.clientY, side);
        });

        // 空白处左键 → 清除焦点与勾选（标准行为）
        list.addEventListener('click', (e) => {
            if (e.target.closest('.list-item')) return;
            if (blankLeftMenu) {
                showBlankMenu(e.clientX, e.clientY, side);
                return;
            }
            // 清除焦点 + 清除勾选
            if (side === 'left') {
                leftSelected.clear();
                leftFocus = null;
            } else {
                rightSelected.clear();
                rightFocus = null;
            }
            resetPanel();
            renderList(side);
        });

        // 滚动时收起菜单
        list.addEventListener('scroll', hideContextMenu, true);
    }

    // ---------------------------------------------------------------------
    // 右键菜单
    // ---------------------------------------------------------------------

    // showContextMenu 显示右键菜单。
    //
    // 自由修改模式：复制 / 剪切 / 粘贴
    // 安全加载隔离模式：左侧为「隔离」，右侧为「启用」
    function showContextMenu(x, y, side, item) {
        elContextMenu.innerHTML = '';
        const isFree = opMode === 'free';

        const addItem = (label, handler, disabled) => {
            const mi = document.createElement('div');
            mi.className = 'menu-item' + (disabled ? ' disabled' : '');
            mi.innerText = label;
            if (!disabled) {
                mi.onclick = () => {
                    hideContextMenu();
                    handler();
                };
            }
            elContextMenu.appendChild(mi);
        };
        const addSep = () => {
            const sep = document.createElement('div');
            sep.className = 'menu-sep';
            elContextMenu.appendChild(sep);
        };

        if (isFree) {
            // 自由修改模式：复制 / 剪切 / 粘贴
            addItem('复制', () => doCopy(side));
            addItem('剪切', () => doCut(side));
            addSep();
            addItem('粘贴到此处', () => doPaste(side), !clipboardHasContent());
            addSep();
            if (item && item.type === 'folder') {
                addItem('隐藏该空文件夹', () => hideFolder(item, side));
            }
        } else {
            // 安全加载隔离模式
            if (side === 'left') {
                addItem('隔离', () => isolateSelection());
            } else {
                addItem('启用', () => restoreSelection());
            }
            if (item && item.type === 'folder') {
                addSep();
                addItem('隐藏该空文件夹', () => hideFolder(item, side));
            }
        }

        elContextMenu.classList.add('show');
        // 防止菜单超出窗口
        const rect = elContextMenu.getBoundingClientRect();
        const px = Math.min(x, window.innerWidth - rect.width - 8);
        const py = Math.min(y, window.innerHeight - rect.height - 8);
        elContextMenu.style.left = px + 'px';
        elContextMenu.style.top = py + 'px';
    }

    function hideContextMenu() {
        elContextMenu.classList.remove('show');
    }

    // 菜单关闭：只在「按下的目标既不是菜单、也不是列表行」时关闭。
    //
    // 历史 bug：document 级 contextmenu 监听与行级 oncontextmenu 打架 ——
    // 行 handler 打开菜单后事件继续冒泡到 document，被立刻 hideContextMenu()，
    // 表现为「菜单一闪就消失」。
    // 修法：改用捕获阶段的 pointerdown，并排除菜单与行本身。
    document.addEventListener('pointerdown', (e) => {
        if (e.target.closest && e.target.closest('.context-menu')) return;
        if (e.target.closest && e.target.closest('.list-item')) return;
        hideContextMenu();
    }, true);
    window.addEventListener('blur', hideContextMenu);
    window.addEventListener('resize', hideContextMenu);

    // ---------------------------------------------------------------------
    // 复制 / 剪切 / 粘贴（自由修改模式）
    // ---------------------------------------------------------------------

    let clipboardState = { op: '', paths: [] };

    function clipboardHasContent() {
        return clipboardState && clipboardState.op && clipboardState.paths && clipboardState.paths.length > 0;
    }

    // sideToBackend 把前端侧别映射为后端常量。
    function sideToBackend(side) {
        return side === 'left' ? 'kks' : 'del';
    }

    async function doCopy(side) {
        const paths = Array.from(side === 'left' ? leftSelected : rightSelected);
        if (paths.length === 0) {
            log('请先勾选要复制的条目。', 'warn');
            return;
        }
        const res = await callBackend('SetClipboard', 'copy', paths, sideToBackend(side), currentMode);
        if (!res.success) {
            showAlert(res.message || '复制失败。');
            return;
        }
        clipboardState = res.data || { op: 'copy', paths };
        log(res.message || '已复制。', 'success');
        updateClipHints();
    }

    async function doCut(side) {
        const paths = Array.from(side === 'left' ? leftSelected : rightSelected);
        if (paths.length === 0) {
            log('请先勾选要剪切的条目。', 'warn');
            return;
        }
        const res = await callBackend('SetClipboard', 'cut', paths, sideToBackend(side), currentMode);
        if (!res.success) {
            showAlert(res.message || '剪切失败。');
            return;
        }
        clipboardState = res.data || { op: 'cut', paths };
        log(res.message || '已剪切。', 'success');
        updateClipHints();
    }

    // doPaste 粘贴到当前焦点所在的目录。
    //
    // 目标目录 = 焦点文件夹本身（焦点在文件夹上时，粘贴到该文件夹内），
    // 若焦点不在文件夹上，则粘贴到当前浏览的目录。
    async function doPaste(side) {
        if (!clipboardHasContent()) {
            log('剪贴板为空。', 'warn');
            return;
        }
        const focus = side === 'left' ? leftFocus : rightFocus;
        const nodes = side === 'left' ? leftNodes : rightNodes;
        const curPath = side === 'left' ? leftCurrentPath : rightCurrentPath;

        let targetDir = null;
        if (focus && focus.type === 'folder') {
            targetDir = focus.id;
        } else {
            // 找到当前目录对应的绝对路径
            const root = side === 'left' ? leftRoot : rightRoot;
            targetDir = curPath ? root + '/' + curPath : root;
            // 兜底：用当前目录下的任一节点推导
            const anyNode = nodes.find(n => n.path === curPath);
            if (anyNode) {
                targetDir = curPath ? anyNode.id.substring(0, anyNode.id.length - anyNode.name.length - 1) : root;
            }
        }
        if (!targetDir) {
            log('无法确定粘贴目标目录，请先双击进入一个文件夹。', 'warn');
            return;
        }

        const res = await callBackend('PasteClipboard', targetDir, sideToBackend(side), currentMode);
        if (!res.success) {
            showAlert(res.message || '粘贴失败。');
            return;
        }
        const result = res.data || {};
        renderOpLogs(result.logs);
        if (result.failedCount > 0) {
            log('粘贴存在失败项，请查看日志。', 'warn');
        } else {
            log(res.message || '粘贴完成。', 'success');
        }
        if (result.op === 'cut' || clipboardState.op === 'cut') {
            clipboardState = { op: '', paths: [] };
        }
        updateClipHints();
        await refreshAll();
    }

    function updateClipHints() {
        const state = clipboardHasContent()
            ? `剪贴板: ${clipboardState.op === 'cut' ? '剪切' : '复制'} ${clipboardState.paths.length} 项`
            : '剪贴板为空';
        document.getElementById('clip-hint-left').innerText = state;
        document.getElementById('clip-hint-right').innerText = state;
        document.getElementById('btn-paste-left').disabled = !clipboardHasContent();
        document.getElementById('btn-paste-right').disabled = !clipboardHasContent();
    }

    // ---------------------------------------------------------------------
    // 隐藏空文件夹
    // ---------------------------------------------------------------------

    async function hideFolder(item, side) {
        if (!item || item.type !== 'folder') {
            log('只能隐藏文件夹。', 'warn');
            return;
        }
        const res = await callBackend('HideFolders', [item.id], sideToBackend(side));
        if (!res.success) {
            showAlert(res.message || '隐藏失败。');
            return;
        }
        const result = res.data || {};
        renderOpLogs(result.logs);
        log(res.message || '隐藏完成。', 'success');
        await refreshAll();
    }

    // restoreHiddenFolders 恢复被隐藏的文件夹。
    async function restoreHiddenFolders() {
        if (leftSelected.size === 0) {
            log('请先勾选要恢复的隐藏文件夹。', 'warn');
            return;
        }
        // 传相对路径（索引 key），后端也会做归一化兜底
        const paths = Array.from(leftSelected).map(id => {
            const node = findNodeByID('left', id);
            return (node && node.rel) ? node.rel : id;
        });
        const res = await callBackend('RestoreInvisibleFolders', paths);
        if (!res.success) {
            showAlert(res.message || '恢复失败。');
            return;
        }
        const result = res.data || {};
        renderOpLogs(result.logs);
        log(res.message || '恢复完成。', 'success');
        leftSelected.clear();
        await refreshAll();
    }

    // renderOpLogs 把操作结果里的日志条目写进前端日志框（同时会进后端环形缓冲）。
    //
    // 注意：这里只做「即时的界面反馈」，完整历史在后端环形缓冲里，
    // 通过日志窗口（§3.6）查看。
    function renderOpLogs(logs) {
        (logs || []).forEach(entry => {
            const level = entry.level || 'info';
            const type = level === 'success' ? 'success'
                       : level === 'warn' ? 'warn'
                       : level === 'error' ? 'err'
                       : 'info';
            log(entry.message, type);
        });
    }

    // isolateSelection 执行隔离（左侧栏选中项 -> 隔离区）。
    async function isolateSelection() {
        if (leftSelected.size === 0) return log('请先在左侧勾选要隔离的文件。', 'warn');
        if (currentMode === 'zipmod') return log('Zipmod 模式为只读视图，无法执行隔离。', 'warn');
        if (currentMode === 'invisible') return log('隐藏的文件夹模式不支持隔离。', 'warn');

        const paths = Array.from(leftSelected);
        log(`--- 开始隔离操作 (${paths.length} 个条目) ---`);

        const res = await callBackend('ExecuteIsolate', paths, currentMode);
        if (!res.success) {
            showAlert(res.message || '隔离操作失败。');
            return;
        }
        const result = res.data || {};
        renderOpLogs(result.logs);
        log(`隔离完成：资源 ${result.movedCards || 0} 个，MOD ${result.movedMods || 0} 个，保留 MOD ${result.keptMods || 0} 个。`, 'success');

        leftSelected.clear();
        resetPanel();
        leftFocus = null;
        await refreshAll();
    }

    // restoreSelection 执行恢复（右侧栏选中项 -> 游戏目录）。
    async function restoreSelection() {
        if (rightSelected.size === 0) return log('请先在右侧勾选要恢复的文件。', 'warn');
        if (currentMode === 'invisible') return log('隐藏的文件夹模式请使用「恢复隐藏文件夹」按钮。', 'warn');

        const paths = Array.from(rightSelected);
        log(`--- 开始恢复操作 (${paths.length} 个条目) ---`);

        const res = await callBackend('ExecuteRestore', paths, currentMode);
        if (!res.success) {
            showAlert(res.message || '恢复操作失败。');
            return;
        }
        const result = res.data || {};
        renderOpLogs(result.logs);
        log(`恢复完成：资源 ${result.restoredCards || 0} 个，MOD ${result.restoredMods || 0} 个。`, 'success');

        rightSelected.clear();
        resetPanel();
        rightFocus = null;
        await refreshAll();
    }

    document.getElementById('btn-exec-left').onclick = isolateSelection;
    document.getElementById('btn-exec-right').onclick = restoreSelection;
    document.getElementById('btn-restore-hidden').onclick = restoreHiddenFolders;

    // 剪贴板工具条按钮
    document.getElementById('btn-copy-left').onclick = () => doCopy('left');
    document.getElementById('btn-cut-left').onclick = () => doCut('left');
    document.getElementById('btn-paste-left').onclick = () => doPaste('left');
    document.getElementById('btn-copy-right').onclick = () => doCopy('right');
    document.getElementById('btn-cut-right').onclick = () => doCut('right');
    document.getElementById('btn-paste-right').onclick = () => doPaste('right');

    // ---------------------------------------------------------------------
    // UI 交互
    // ---------------------------------------------------------------------

    document.getElementById('mode-select').onchange = (e) => {
        currentMode = e.target.value;
        leftCurrentPath = ''; rightCurrentPath = '';
        leftSelected.clear(); rightSelected.clear();
        leftFocus = null; rightFocus = null;
        resetPanel();
        syncModeButtons();
        applyModeButtons();
        renderAll();
        refreshAll();
        log(`已切换至模式: ${modeLabels[currentMode] || currentMode}`);
    };

    document.getElementById('btn-reset').onclick = () => {
        leftSelected.clear(); rightSelected.clear();
        leftFocus = null; rightFocus = null;
        resetPanel();
        renderAll();
        log('已清除所有勾选。');
    };

    // 全选：包含当前目录下的文件夹与文件（文件夹会级联勾选其子级）
    elSelectAllLeft.onchange = (e) => {
        const items = leftNodes.filter(n => n.path === leftCurrentPath);
        items.forEach(n => setItemSelected('left', n, e.target.checked));
        renderList('left');
    };

    elSelectAllRight.onchange = (e) => {
        const items = rightNodes.filter(n => n.path === rightCurrentPath);
        items.forEach(n => setItemSelected('right', n, e.target.checked));
        renderList('right');
    };

    elBtnBackLeft.onclick = () => {
        const parts = leftCurrentPath.split('/');
        parts.pop();
        leftCurrentPath = parts.join('/');
        renderList('left');
    };

    elBtnBackRight.onclick = () => {
        const parts = rightCurrentPath.split('/');
        parts.pop();
        rightCurrentPath = parts.join('/');
        renderList('right');
    };

    // 选择 KKS 根目录
    document.getElementById('btn-select-root').onclick = async () => {
        setStatus('loading', '正在加载', 0);
        const res = await callBackend('SelectKKSRoot');
        if (!res.success) {
            // 用户取消选择：回到未选择状态
            setStatus('idle', '未选择路径');
            log(res.message || '选择目录失败。', 'err');
            return;
        }

        const data = res.data || {};
        if (data.valid === false) {
            // 目录结构不符合预设：加载错误，进度条中止变黄
            setStatus('error', '加载错误');
            showAlert(res.message || '加载错误：目录结构不符合预设。', '加载错误');
            if (data.missing && data.missing.length) {
                log('缺少必需的目录: ' + data.missing.join('、'), 'err');
            }
            return;
        }

        kksReady = true;
        elRootLabel.innerText = `KKS: ${data.kksRoot || ''}  |  隔离区: ${data.delCardsRoot || ''}`;
        elRootLabel.title = `KKS: ${data.kksRoot || ''}\n隔离区: ${data.delCardsRoot || ''}`;
        log(res.message || '已选择 KKS 根目录。', 'success');
        setStatus('loading', '正在加载', 0);
        await refreshAll();
    };

    // 重新扫描（重建全局依赖图）
    document.getElementById('btn-switch-mode').onclick = async () => {
        if (!kksReady) {
            log('请先选择 KKS 根目录。', 'warn');
            return;
        }
        setStatus('loading', '正在加载', 0);
        log('触发重新扫描...');

        const res = await callBackend('Rescan');
        if (!res.success) {
            setStatus('error', '加载错误');
            showAlert(res.message || '重新扫描失败。');
            return;
        }
        const data = res.data || {};
        if (data.valid === false) {
            setStatus('error', '加载错误');
            showAlert(res.message || '加载错误：目录结构不符合预设。', '加载错误');
            if (data.missing && data.missing.length) {
                log('缺少必需的目录: ' + data.missing.join('、'), 'err');
            }
            return;
        }
        log(res.message || '已触发重新扫描。', 'success');
        await refreshAll();
    };

    // 监听后端扫描事件
    function bindEvents() {
        if (!window.runtime || !window.runtime.EventsOn) return;
        window.runtime.EventsOn('scan:progress', (e) => {
            const d = e && e.payload ? e.payload : e;
            const total = d.total || 0;
            const done = d.done || 0;
            // zipmod 与资源两个阶段各占一半进度
            const base = d.phase === 'resource' ? 50 : 0;
            const span = d.phase === 'resource' ? 50 : 50;
            const percent = total > 0 ? base + (done / total) * span : base;
            const phaseText = d.phase === 'resource' ? '正在扫描资源文件' : '正在索引 zipmod';
            setStatus('loading', `正在加载 · ${phaseText} (${done}/${total})`, percent);
        });
        window.runtime.EventsOn('scan:done', (e) => {
            const d = e && e.payload ? e.payload : e;
            if (d.success === false) {
                setStatus('error', '加载错误');
                log(d.message || '加载错误。', 'err');
                return;
            }
            setStatus('done', d.message || '扫描完成');
            log(d.message || '扫描完成。', 'success');
            refreshAll();
        });
        // 缩略图批量补图（§10.3）：按 thumbKey 局部替换 <img src>，
        // **不重渲染整个面板**。
        const handleThumbs = (e) => {
            const payload = (e && e.payload) ? e.payload : e;
            const list = Array.isArray(payload) ? payload : [payload];
            if (!list.length) return;
            list.forEach(r => {
                if (!r || !r.thumbKey || !r.dataUri) return;
                panelThumbs.set(r.thumbKey, r.dataUri);
                const cells = document.querySelectorAll(`.panel-cell[data-thumb-key="${r.thumbKey}"]`);
                cells.forEach(cell => {
                    const thumb = cell.querySelector('.thumb');
                    if (!thumb) return;
                    thumb.classList.remove('is-pending');
                    thumb.innerHTML = '';
                    const img = document.createElement('img');
                    img.src = r.dataUri;
                    thumb.appendChild(img);
                });
            });
        };
        window.__thumbHandler = handleThumbs;
        window.runtime.EventsOn('thumb:ready', handleThumbs);
        window.runtime.EventsOn('history:changed', () => {
            if (elHistoryModal.classList.contains('show')) reloadHistory();
        });
        window.runtime.EventsOn('scan:complete', (e) => {
            const d = e && e.payload ? e.payload : e;
            if (d.missingMods && d.missingMods.length) {
                log(`提示：本地缺失 ${d.missingMods.length} 个被引用的 zipmod。`, 'warn');
            }
        });
    }

    // 初始化
    setStatus('idle', '未选择路径');
    log('系统初始化完成。请点击顶部「选择 KKS 根目录」开始。', 'info');
    bindEvents();
    bindListEvents('left');
    bindListEvents('right');
    applyOpMode();
    updateClipHints();
    renderAll();
</script>
</body>
</html>
